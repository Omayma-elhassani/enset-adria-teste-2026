spring.application.name=account-service
server.port=8081

# Config Server (partie D) - optionnel pour pouvoir demarrer seul
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

# Eureka (partie D)
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Base H2
spring.datasource.url=jdbc:h2:mem:accounts-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GraphQL (GraphiQL : http://localhost:8081/graphiql)
spring.graphql.graphiql.enabled=true

# MCP server (endpoint : POST http://localhost:8081/mcp)
spring.ai.mcp.server.name=account-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

management.endpoints.web.exposure.include=health,info,refresh
