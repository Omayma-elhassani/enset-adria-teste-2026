spring.application.name=transaction-service
server.port=8082

# Config Server (partie D) - optionnel pour pouvoir demarrer seul
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

# Eureka (partie D)
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Valeur par defaut du plafond (surchargee par le Config Server en partie D)
bank.transaction.max-amount=1000

# Base H2
spring.datasource.url=jdbc:h2:mem:transactions-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GraphQL (GraphiQL : http://localhost:8082/graphiql)
spring.graphql.graphiql.enabled=true

# MCP server (endpoint : POST http://localhost:8082/mcp)
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

# OpenFeign + Resilience4J
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException.NotFound,feign.FeignException.BadRequest
resilience4j.timelimiter.configs.default.timeout-duration=5s

# Si Eureka n'est pas encore demarre (tests de la partie C) : adresse directe d'account-service
spring.cloud.discovery.client.simple.instances.account-service[0].uri=http://localhost:8081

management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers
management.health.circuitbreakers.enabled=true
