spring.application.name=notification-service
server.port=8084

# Config Server et Eureka (optionnels pour pouvoir demarrer seul)
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Kafka (partie F) : consumer du topic bank.transactions.created
bank.kafka.topic=bank.transactions.created
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Journalisation des evenements : console + fichier logs/notification-service.log
logging.file.name=logs/notification-service.log
logging.level.org.apache.kafka=WARN

management.endpoints.web.exposure.include=health,info
