<div class="page-header">
  <div>
    <h1>Assistant bancaire</h1>
    <p class="muted">chatbot-service : agent Spring AI (Gemini) + tools MCP des micro-services</p>
  </div>
  <button class="btn" (click)="reset()">Nouvelle conversation</button>
</div>

<div class="card chat">
  <div class="chat-messages" #scroller>
    @for (m of messages(); track $index) {
      <div class="bubble" [class]="m.role">{{ m.text }}</div>
    }
    @if (pending()) { <div class="bubble assistant typing">L'assistant réfléchit…</div> }
  </div>

  <div class="suggestions">
    @for (s of suggestions; track s) {
      <button class="chip" type="button" (click)="send(s)" [disabled]="pending()">{{ s }}</button>
    }
  </div>

  <form class="chat-input" (ngSubmit)="send()">
    <input name="draft" [(ngModel)]="draft" placeholder="Votre question…" [disabled]="pending()" autocomplete="off" />
    <button class="btn primary" type="submit" [disabled]="pending() || !draft.trim()">Envoyer</button>
  </form>
</div>
