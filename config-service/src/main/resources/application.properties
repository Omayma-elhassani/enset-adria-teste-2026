spring.application.name=config-service
server.port=9999

# Profil "native" : les fichiers de configuration sont lus dans le dossier config-repo
# (en production on utiliserait un depot Git : spring.cloud.config.server.git.uri=...)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:classpath:/config-repo/}

eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
