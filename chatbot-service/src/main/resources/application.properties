spring.application.name=chatbot-service
server.port=8083

spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# LLM : Google Gemini (cle gratuite sur https://aistudio.google.com/apikey)
# La cle n'est JAMAIS ecrite dans le code : variable d'environnement GEMINI_API_KEY
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2

# Client MCP (Streamable HTTP) vers les serveurs MCP des micro-services metier
spring.ai.mcp.client.name=bank-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
# Connexion paresseuse : le chatbot demarre meme si account/transaction-service sont arretes
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.streamable-http.connections.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8085}
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=${TRANSACTION_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info
