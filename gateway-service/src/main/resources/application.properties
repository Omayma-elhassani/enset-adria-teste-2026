spring.application.name=gateway-service
server.port=8888

spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Routes statiques : lb:// = resolution via Eureka + load balancing
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.server.webflux.routes[1].id=transaction-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.server.webflux.routes[2].id=chatbot-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://chatbot-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/chat/**

# Routes dynamiques : http://localhost:8888/<nom-du-service>/...
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# CORS pour le client Angular (partie G)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read_only
